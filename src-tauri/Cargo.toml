[package]
name = "glyph-arena"
version = "0.1.1"
description = "Glyph Arena: find out which AI recipe is best for your own vault and tasks"
authors = ["fru.dev"]
edition = "2021"
license = "MIT"

[lib]
name = "glyph_arena_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
